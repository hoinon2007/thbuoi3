<!DOCTYPE html>
<html lang="vi">
     <head>
           <title>Thiết kế Form đăng nhập</title>
           <meta charset= "UTF-8" />
            <link rel="stylesheet" href="../css/style2.css">
     </head>
     <body>
       <div class="container">
			<form id= "frmLogin">
			<h2> Login </h2>
			<div class="form-group">
				<label for="txtUsername">Username:</label>
				<input class="form control" type="text" name="txtUsername" id="txtUsername">
			</div>
			<div class="form-group">
				<label for="txtPassword">Password:</label>
				<input class="form-control" type="password" name="txtPassword" id="txtPassword">
			</div>
			<input class="button" type="submit" name="sbLogin" value="Login">
			<input class="button" type="reset" name="rsCancel" value="Cancel">
			</form>
	   </div>
</html>
